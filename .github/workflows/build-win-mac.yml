---
name: Build - Windows and macOS
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      ci_version:
        required: true
        type: string
    secrets:
      # Optional: base64-encoded PKCS#12 bundle with a code signing certificate
      # and its password. When present, the macOS app and DMG are signed with it
      # so macOS treats every build as the same app (needed for Local Network
      # permission to persist across builds). A self-signed cert is enough.
      MACOS_SIGNING_P12:
        required: false
      MACOS_SIGNING_PASSWORD:
        required: false

jobs:
  build:
    env:
      CI_VERSION: ${{ inputs.ci_version }}
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows (disabled in this fork; steps are kept for easier rebasing)
          # - os: windows-2025
          #   qt_version: 6.12.0
          # macOS
          - os: macos-26
            qt_version: 6.11.2

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Download dependencies (Windows)
        if: runner.os == 'Windows'
        run: powershell ./setup-deps.ps1

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: ${{ runner.os != 'Windows' }}
          add-tools-to-path: ${{ runner.os != 'Windows' }}
          tools: ${{ runner.os == 'Windows' && 'tools_qtcreator_gui' || '' }}
          version: ${{ matrix.qt_version }}
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@073e34d7c2ab4ae6961ed7cca690b3abd5ba5a7e'

      - name: Install Qt ARM64 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          set-env: false
          add-tools-to-path: false
          arch: win64_msvc2022_arm64_cross_compiled
          version: ${{ matrix.qt_version }}

      - name: Build x64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release x64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ matrix.qt_version }}\msvc2022_64\bin

      - name: Build ARM64 binaries (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set "PATH=%QT_PATH%;%PATH%"
          scripts\build-arch.bat Release arm64
        env:
          QT_PATH: ${{ runner.workspace }}\Qt\${{ matrix.qt_version }}\msvc2022_arm64\bin

      - name: Import code signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_SIGNING_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          P12="$RUNNER_TEMP/signing.p12"
          CERT="$RUNNER_TEMP/signing.crt"

          echo "$MACOS_SIGNING_P12" | base64 --decode > "$P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$MACOS_SIGNING_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          openssl pkcs12 -in "$P12" -clcerts -nokeys -out "$CERT" -passin "pass:$MACOS_SIGNING_PASSWORD" \
            || openssl pkcs12 -legacy -in "$P12" -clcerts -nokeys -out "$CERT" -passin "pass:$MACOS_SIGNING_PASSWORD"
          IDENTITY="$(openssl x509 -in "$CERT" -noout -subject -nameopt sep_multiline | sed -n 's/^ *CN=//p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "Could not read CN from signing certificate"; exit 1; }

          case "$IDENTITY" in
            "Developer ID Application:"*|"Apple Development:"*|"Apple Distribution:"*)
              # Apple-issued certificate: make sure the Apple intermediate CA is
              # available so codesign can build the chain. Hardened runtime stays on.
              curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
                && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
              ;;
            *)
              # Self-signed certificate: trust it so codesign can build a chain to it,
              # and skip the hardened runtime. Without a Team ID its library validation
              # would reject the bundled Qt/SDL/FFmpeg libraries at launch.
              sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$CERT"
              echo "CODESIGN_OPTIONS=--timestamp" >> "$GITHUB_ENV"
              ;;
          esac

          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "Signing with identity: $IDENTITY"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          rm -f "$P12"

      - name: Build Package
        shell: pwsh
        run: |
          if ($Env:RUNNER_OS -eq "Windows") {
            cmd /c scripts\generate-bundle.bat Release
          } else {
            bash scripts/generate-dmg.sh Release
          }

      - name: Upload Binaries (Windows x64)
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: Moonlight-${{ runner.os }}-x64-${{ env.CI_VERSION }}
          path: build/deploy-x64-release/*
          if-no-files-found: error

      - name: Upload Binaries (Windows arm64)
        uses: actions/upload-artifact@v6
        if: runner.os == 'Windows'
        with:
          name: Moonlight-${{ runner.os }}-arm64-${{ env.CI_VERSION }}
          path: build/deploy-arm64-release/*
          if-no-files-found: error

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v6
        if: runner.os == 'macOS'
        with:
          name: Moonlight-${{ runner.os }}-${{ env.CI_VERSION }}
          path: build/installer-Release/*.dmg
          compression-level: 0
          if-no-files-found: error

      - name: Upload Symbols
        uses: actions/upload-artifact@v6
        with:
          name: zDevDbgSyms-${{ runner.os }}-${{ env.CI_VERSION }}
          path: |
            build/installer-*/*.dsym/*
            build/symbols-*/*.pdb
          if-no-files-found: error
